<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123B63" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), local-network-access=()" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      (function () {
        var host = location.hostname
        var icon = host.indexOf('lumespec.com') >= 0 || host === 'testtim.tire.bel.tr'
          ? '/lumespec-icon.png'
          : '/favicon.png'
        document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach(function (link) {
          link.href = icon
          link.type = 'image/png'
        })
      })()
    </script>
    <title>Tire İletişim Merkezi</title>
    <meta property="og:title" content="Tire İletişim Merkezi" />
    <meta property="og:description" content="Tire Belediyesi İletişim Merkezi" />
    <meta property="og:image" content="/tire-belediyesi-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/tire-belediyesi-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
